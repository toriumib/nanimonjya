name: nanimonjya
description: ペタネーム - 顔と名前の記憶トレーニング（旧ナニモンジャ、内部パッケージ名は互換のため維持）
publish_to: 'none'

version: 2.5.0+193

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # 多言語対応
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.2
  google_mobile_ads: ^5.1.0
  change_app_package_name: ^1.1.0
  firebase_core: ^3.4.0
  cloud_firestore: ^5.0.0
  firebase_auth: ^5.1.1
  uuid: ^4.4.0
  cloud_functions: ^5.5.1
  just_audio: ^0.9.36
  url_launcher: ^6.3.0  # Buy Me a Coffee のリンクを開くために追加
  shared_preferences: ^2.3.2  # コイン/実績/デイリー等のローカル保存
  confetti: ^0.8.0  # 勝利演出の紙吹雪
  flutter_svg: ^2.0.10  # 応援キャラのイラスト表示
  share_plus: ^10.1.1  # 合言葉リンクをLINE/Discord等で共有
  app_links: ^6.3.2  # ディープリンク（リンクからルーム入室）
  firebase_analytics: ^11.3.0  # 画面遷移・広告視聴などの行動ログ
  firebase_messaging: ^15.1.0  # 既存ユーザーへのお知らせプッシュ（Firebaseコンソールから配信）
  firebase_crashlytics: ^4.1.0  # クラッシュレポート（Web非対応、kIsWebガード必須）
  flutter_local_notifications: ^18.0.1  # デイリーボーナスのリマインド通知
  timezone: ^0.10.0  # 通知の毎日スケジュール用
  # ⚠️ **google_fonts は外した。** 実行時に fonts.gstatic.com へ
  #    取りにいくので、圏外だと SocketException を投げる。
  #    それを FlutterError 経由で「致命的」として記録していたため、
  #    Crashlytics のクラッシュの大半がこれで埋まっていた（2026-08）。
  #    ロゴのフォントは assets/fonts に同梱してある。
  flutter_animate: ^4.5.0  # ポップな演出アニメーション
  in_app_review: ^2.0.9  # ストアレビュー依頼
  image_picker: ^1.1.2  # 自分の写真アップロード（おぼえるモード）
  google_mlkit_text_recognition: ^0.13.0  # 名刺のOCR取り込み（端末内処理・モバイル限定）
  path_provider: ^2.1.4  # アップ写真の永続保存先ディレクトリ取得
  flutter_tts: ^4.2.0  # 名刺の自己紹介を音声で読み上げ（ja/en対応、思い出しトレーニング）
  characters: ^1.4.0
  # 💳 in_app_purchase は取り下げた。
  # Play が Billing Library 8.0.0 以降を必須化したが、それを積む
  # in_app_purchase_android は 0.4.0+11 以降すべて Dart 3.10（Flutter 3.35+）
  # 必須で、本プロジェクトの Flutter 3.32 では解決できない。
  # 依存を残すと11月以降アップデートが承認されないため削除する。
  # 購入済みユーザーの adsRemoved は端末に残り、広告は出ないままになる。
  # 課金を再開するときは Flutter を上げてから in_app_purchase: ^3.3.0 を入れる。


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

# The following section is specific to Flutter packages.
flutter:
  generate: true # 多言語ファイルの自動生成
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/supporters/
    - assets/images/faces/
    # チュートリアルで使う実際のゲーム画面のスクショ
    - assets/images/tutorial/
    - assets/audio/
  # 🈶 日本語フォントは**同梱**する。
  #    google_fonts の実行時ダウンロードだけに頼っていたため、フォントが
  #    届くまでの間（Webでは常時）CJKのフォールバック書体が使われ、
  #    日本語の「、」「。」が行の中央に浮いて表示されていた。
  #    句読点の位置は中国語系の書体だと中央、日本語書体だと左下になる。
  #    同梱すれば初回表示から必ず日本語書体で出る。
  #    ライセンスは SIL Open Font License 1.1（assets/fonts/OFL.txt）。
  fonts:
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
    # 🅰 ロゴ専用。**ロゴに出る文字だけに絞ってある**（5.16MB → 25KB）。
    #    絞りかたは tools/subset_logo_font.py を見ること。
    #    ⚠️ ロゴの文言を変えたら、フォントも作り直す。
    #       入っていない字は豆腐（□）になる。
    - family: MochiyPopOne
      fonts:
        - asset: assets/fonts/MochiyPopOne-Logo.ttf
    # 🎉 お祝い演出専用の極太。こちらも出す文言の字だけ。
    - family: DelaGothicOne
      fonts:
        - asset: assets/fonts/DelaGothicOne-Pop.ttf

flutter_icons:
  ios: true
  image_path: "assets/images/launcher/icon.png"
  remove_alpha_ios: true
  android: true
  adaptive_icon_background: "assets/images/launcher/icon_adaptive_background.png"
  adaptive_icon_foreground: "assets/images/launcher/icon_adaptive_foreground.png"
