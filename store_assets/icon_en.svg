<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#00C2A8"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8F0FE"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Name tag shape -->
  <rect x="120" y="140" width="272" height="240" rx="28" fill="url(#tag)" stroke="#2B5CA5" stroke-width="4"/>

  <!-- Pin hole -->
  <circle cx="256" cy="172" r="12" fill="#3A7BD5"/>

  <!-- Pin string -->
  <line x1="256" y1="172" x2="256" y2="200" stroke="#2B5CA5" stroke-width="3" stroke-linecap="round"/>

  <!-- Face icon silhouette on name tag -->
  <circle cx="256" cy="260" r="50" fill="none" stroke="#2B5CA5" stroke-width="3"/>
  <circle cx="242" cy="248" r="6" fill="#2B5CA5"/>
  <circle cx="270" cy="248" r="6" fill="#2B5CA5"/>
  <path d="M 236 275 Q 256 295 276 275" fill="none" stroke="#2B5CA5" stroke-width="3" stroke-linecap="round"/>

  <!-- Name text -->
  <text x="256" y="335" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="20" font-weight="900" fill="#2B5CA5">NAME?</text>
</svg>
