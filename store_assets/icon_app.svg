<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2027"/>
      <stop offset="50%" stop-color="#203A43"/>
      <stop offset="100%" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#FFA500"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8F4FF"/>
    </linearGradient>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark premium bg -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Corner accents -->
  <circle cx="85" cy="85" r="50" fill="#FFD700" opacity="0.05"/>
  <circle cx="440" cy="440" r="70" fill="#FFD700" opacity="0.05"/>

  <!-- Tilted business card -->
  <g filter="url(#cardShadow)" transform="rotate(-8, 256, 200)">
    <rect x="105" y="110" width="302" height="190" rx="22" fill="url(#cardBg)"/>
    <!-- Gold border -->
    <rect x="105" y="110" width="302" height="190" rx="22" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <!-- Face silhouette on card -->
    <circle cx="256" cy="195" r="38" fill="none" stroke="#203A43" stroke-width="3"/>
    <circle cx="243" cy="184" r="5" fill="#203A43"/>
    <circle cx="269" cy="184" r="5" fill="#203A43"/>
    <path d="M 236 207 Q 256 224 276 207" fill="none" stroke="#203A43" stroke-width="3" stroke-linecap="round"/>
    <!-- Name text on card -->
    <text x="256" y="258" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="14" font-weight="900" fill="#2C5364">佐藤 さん</text>
    <rect x="200" y="268" width="112" height="1.5" rx="1" fill="#FFD700" opacity="0.4"/>
  </g>

  <!-- Big ? overlapping card edge -->
  <text x="256" y="155" text-anchor="middle" font-family="MochiyPopOne, sans-serif" font-size="100" font-weight="900" fill="url(#gold)" filter="url(#glow)">？</text>

  <!-- App name -->
  <text x="256" y="450" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="5">なまえがお</text>

  <!-- Gold bar -->
  <rect x="170" y="466" width="172" height="3.5" rx="1.5" fill="url(#gold)" opacity="0.85"/>

</svg>
