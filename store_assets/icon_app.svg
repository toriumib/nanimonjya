<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6A3D"/>
      <stop offset="50%" stop-color="#E8663C"/>
      <stop offset="100%" stop-color="#FFC02E"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF3E0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <circle cx="100" cy="100" r="4" fill="#FFFFFF" opacity="0.3"/>
  <circle cx="420" cy="80" r="3" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="400" cy="440" r="5" fill="#FFFFFF" opacity="0.2"/>
  <circle cx="80" cy="420" r="3" fill="#FFFFFF" opacity="0.3"/>

  <!-- Name tag card -->
  <g filter="url(#shadow)">
    <rect x="120" y="130" width="272" height="260" rx="28" fill="url(#tag)" stroke="#E8663C" stroke-width="3"/>
  </g>

  <!-- Pin hole + string -->
  <circle cx="256" cy="168" r="13" fill="#E8663C"/>
  <line x1="256" y1="168" x2="256" y2="200" stroke="#E8663C" stroke-width="3" stroke-linecap="round"/>

  <!-- Face silhouette -->
  <circle cx="256" cy="270" r="56" fill="none" stroke="#2B2B2B" stroke-width="3.5"/>
  <circle cx="238" cy="255" r="7" fill="#2B2B2B"/>
  <circle cx="274" cy="255" r="7" fill="#2B2B2B"/>
  <path d="M 232 288 Q 256 312 280 288" fill="none" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>

  <!-- Japanese text on tag -->
  <text x="256" y="350" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="28" font-weight="900" fill="#2B2B2B">なまえ</text>
  <rect x="180" y="360" width="152" height="2" rx="1" fill="#E8663C" opacity="0.4"/>
  <text x="256" y="378" text-anchor="middle" font-family="Zen Maru Gothic, sans-serif" font-size="14" font-weight="700" fill="#E8663C">が　お</text>
</svg>
